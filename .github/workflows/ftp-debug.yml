name: FTP debug
on:
  push:
    branches: [ftp-debug]
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - env:
          H: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          for d in "" "sea/" "public_html/" "domains/" "domains/marcomarciano.com/" "domains/marcomarciano.com/public_html/"; do
            echo "=== /$d"; curl -s --ssl-reqd -k --list-only --user "$U:$P" "ftp://$H/$d" || echo "(none)"
          done
