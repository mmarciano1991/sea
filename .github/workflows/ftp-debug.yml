name: FTP debug
on:
  push:
    branches: [ftp-debug]
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - env:
          H: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "=== PWD"; curl -s --ssl-reqd -k -v --user "$U:$P" "ftp://$H/" -Q "PWD" --list-only 2>&1 | grep -E "^< 257" || true
          for d in "%2F" "%2Fsea/" "%2Fpublic_html/"; do
            echo "=== $d"; curl -s --ssl-reqd -k --list-only --user "$U:$P" "ftp://$H/$d" || echo "(none)"
          done
